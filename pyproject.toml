[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "servicenow-api"
version = "2.4.11"
description = "Python ServiceNow API Wrapper"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-connector-sdk[mcp]>=0.5.5,<0.6.0", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
servicenow-mcp = "agent_connector_sdk.cli:serve"

[project.entry-points."agent_connector_sdk.prompt_providers"]
servicenow-api = "servicenow_api.prompts"

# CONCEPT:KG-2.320 — federate this package's OWL/RDF ontology module into the
# agent-connector-sdk hub (incidents, changes, CMDB items). Resolved via
# iter_provider_dirs like the skill/prompt providers.

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
servicenow-mcp = "servicenow_api:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
extend-exclude = ["tests"]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
servicenow_api = [ "mcp_config.json", "agent_data/**", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.container]
debug_apt = ["default-jre", "ripgrep", "tree", "fd-find", "curl", "nano", "build-essential", "cmake", "libssl-dev", "libcurl4-openssl-dev", "pkg-config", "cargo", "rustc"]

[tool.pipelines.ontology]
shape_classes = ["AssignmentGroup", "CIRelationship", "Change", "ChangeRequest", "ConfigurationItem", "Incident", "KnowledgeArticle", "LifecycleRequest", "Person", "TRMCategory", "TRMLifecycle", "TRMPhase", "TRMStandard", "TRMTechnicalDebt", "TechnologyRequest"]

[tool.pipelines.codespell]
ignore_words = ["requestor", "requestors"]

[tool.pipelines.api_integration]
baseline = 26.1
