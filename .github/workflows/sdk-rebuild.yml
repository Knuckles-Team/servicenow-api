name: Connector SDK rebuild

on:
  repository_dispatch:
    types: [sdk-release]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      release_repair:
        description: Republish the already published container after the reviewed public-wheel guard.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rebuild:
    uses: Knuckles-Team/pipelines/.github/workflows/connector_sdk_rebuild_pipeline.yml@main
    with:
      release_repair: ${{ inputs.release_repair || false }}
    secrets: inherit
