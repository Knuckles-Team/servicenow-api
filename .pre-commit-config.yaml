# The whole pre-commit configuration of a connector (PIPE-VALIDATION-R001.9). Everything a
# connector used to copy lives in pipelines at `rev: main`: the sanitizer, the standard-file
# check, the codespell defaults and the gate set. A change to a shared check reaches every
# connector with no edit here. Per-repo options go in pyproject.toml tables only.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-merge-conflict
  - id: check-yaml
    args: [--unsafe]
  - id: check-toml
  - id: check-json
  - id: detect-private-key
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-check
  - id: ruff-format
- repo: https://github.com/Knuckles-Team/pipelines
  rev: main
  hooks:
  - id: connector-standard
  - id: secrets
  - id: spec
    stages: [pre-push]
  - id: tests-fast
    stages: [pre-push]
  - id: dependency-readiness
